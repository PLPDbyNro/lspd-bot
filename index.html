<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personnel Roster Dashboard</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-6">
    <div class="max-w-7xl mx-auto">
        <!-- Header -->
        <header class="flex flex-col md:flex-row justify-between items-center mb-8 border-b border-slate-800 pb-4">
            <h1 class="text-3xl font-bold tracking-tight">Personnel Roster</h1>
            <div class="mt-4 md:mt-0 flex gap-4">
                <button onclick="fetchLiveRoster()" class="bg-indigo-600 hover:bg-indigo-500 px-4 py-2 rounded-lg font-medium transition">
                    Refresh Data
                </button>
            </div>
        </header>

        <!-- Main Content Grid / Table Container -->
        <div class="bg-slate-800 rounded-xl shadow-xl overflow-hidden border border-slate-700">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-900/50 text-slate-400 uppercase text-xs tracking-wider border-b border-slate-700">
                            <th class="py-4 px-6">Officer / Member</th>
                            <th class="py-4 px-6">Rank</th>
                            <th class="py-4 px-6">Badge / ID</th>
                            <th class="py-4 px-6">Status</th>
                            <th class="py-4 px-6 text-right">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="roster-table-body" class="divide-y divide-slate-700">
                        <!-- Dynamic rows will inject here -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Script Logic -->
    <script>
        // Set your backend API URL here (e.g., your Railway deployment URL)
        const API_URL = 'https://your-backend-service.up.railway.app/api/roster';

        let officers = [];

        async function fetchLiveRoster() {
            try {
                const response = await fetch(API_URL);
                if (!response.ok) throw new Error('Failed to fetch roster data');
                officers = await response.json();
                renderRoster();
            } catch (err) {
                console.error('Error fetching live roster:', err);
                // Fallback example if backend is unreachable during testing
                renderRoster();
            }
        }

        function renderRoster() {
            const tbody = document.getElementById('roster-table-body');
            tbody.innerHTML = '';

            if (officers.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="text-center py-6 text-slate-400">No personnel records found.</td></tr>`;
                return;
            }

            officers.forEach(officer => {
                const tr = document.createElement('tr');
                tr.className = 'hover:bg-slate-700/50 transition';
                tr.innerHTML = `
                    <td class="py-4 px-6 flex items-center gap-3">
                        <img src="${officer.avatar || 'https://via.placeholder.com/40'}" alt="" class="w-10 h-10 rounded-full bg-slate-700 object-cover">
                        <span class="font-semibold">${officer.name || officer.username || 'Unknown'}</span>
                    </td>
                    <td class="py-4 px-6 text-slate-300">${officer.rank || 'Member'}</td>
                    <td class="py-4 px-6 text-slate-400">${officer.badge || officer.id || 'N/A'}</td>
                    <td class="py-4 px-6">
                        <span class="px-2.5 py-1 text-xs rounded-full font-medium ${
                            officer.status === 'Active' ? 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20' : 'bg-amber-500/10 text-amber-400 border border-amber-500/20'
                        }">
                            ${officer.status || 'Active'}
                        </span>
                    </td>
                    <td class="py-4 px-6 text-right">
                        <button onclick="deleteOfficer('${officer.id}')" class="text-rose-400 hover:text-rose-300 font-medium text-sm transition">
                            Delete
                        </button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        window.deleteOfficer = async function(id) {
            if (confirm('Are you sure you want to delete this officer record?')) {
                try {
                    const response = await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
                    if (response.ok) {
                        await fetchLiveRoster();
                    } else {
                        officers = officers.filter(o => String(o.id) !== String(id));
                        renderRoster();
                    }
                } catch (err) {
                    console.warn('Backend delete failed, performing local UI update', err);
                    officers = officers.filter(o => String(o.id) !== String(id));
                    renderRoster();
                }
            }
        };

        // Initialize the roster on page load
        fetchLiveRoster();
    </script>
</body>
</html>
