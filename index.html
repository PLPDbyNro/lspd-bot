<!DOCTYPE html>
<html lang="en" translate="no" class="notranslate">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google" content="notranslate">
    <title>Prime Legends Police Department - Personnel Roster</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #0f1115; }
        ::-webkit-scrollbar-thumb { background: #262c36; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #3a424f; }
    </style>
</head>
<body class="bg-[#0b0e14] text-[#d1d5db] font-sans antialiased min-h-screen flex flex-col">

    <header class="bg-[#12161d]/90 backdrop-blur border-b border-[#212630] sticky top-0 z-50 shadow-md">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            <div class="flex items-center gap-4">
                <div class="relative group">
                    <img src="logo.png" alt="Prime Legends Logo" class="h-14 w-auto object-contain drop-shadow-[0_0_10px_rgba(59,130,246,0.5)] transition-transform duration-300 group-hover:scale-105" onerror="this.src='https://via.placeholder.com/56?text=PLPD'">
                </div>
                <div>
                    <h1 class="font-black text-xl tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-blue-400 via-indigo-200 to-amber-300">
                        PRIME LEGENDS POLICE DEPARTMENT
                    </h1>
                    <span class="text-xs text-slate-400 font-mono tracking-widest uppercase flex items-center gap-2">
                        <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                        Official Personnel Roster
                    </span>
                </div>
            </div>

            <div class="flex items-center gap-4">
                <div class="hidden md:flex items-center gap-6 bg-[#0f1115] px-4 py-2 rounded-xl border border-[#212630] text-xs shadow-inner">
                    <div>
                        <span class="text-slate-500 uppercase block text-[10px] font-semibold">Total Personnel</span>
                        <span id="stat-total" class="font-bold text-blue-400 text-sm">0</span>
                    </div>
                    <div class="w-px h-6 bg-[#212630]"></div>
                    <div>
                        <span class="text-slate-500 uppercase block text-[10px] font-semibold">Active Duty</span>
                        <span id="stat-active" class="font-bold text-emerald-400 text-sm">0</span>
                    </div>
                    <div class="w-px h-6 bg-[#212630]"></div>
                    <div>
                        <span class="text-slate-500 uppercase block text-[10px] font-semibold">Command Staff</span>
                        <span id="stat-command" class="font-bold text-amber-400 text-sm">0</span>
                    </div>
                </div>

                <button id="admin-toggle-btn" class="px-4 py-2 rounded-lg text-xs font-semibold bg-[#1a202c] hover:bg-[#2d3748] text-slate-200 border border-[#2d3748] transition flex items-center gap-2 shadow-md">
                    <i class="fa-solid fa-lock text-amber-400"></i>
                    <span>Admin Mode</span>
                </button>
            </div>
        </div>
    </header>

    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-6">

        <div class="flex flex-col md:flex-row gap-4 justify-between items-stretch md:items-center bg-[#12161d] p-4 rounded-xl border border-[#212630] shadow-xl">
            <div class="flex flex-1 flex-col sm:flex-row gap-3">
                <div class="relative flex-1">
                    <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-500 text-sm"></i>
                    <input type="text" id="search-input" placeholder="Search officer, badge #, rank, responsibility, or Discord ID..." class="w-full bg-[#0f1115] border border-[#212630] rounded-lg pl-10 pr-4 py-2 text-sm text-slate-200 placeholder-slate-500 focus:outline-none focus:border-blue-500 transition">
                </div>
                <select id="rank-filter" class="bg-[#0f1115] border border-[#212630] rounded-lg px-3 py-2 text-sm text-slate-300 focus:outline-none focus:border-blue-500">
                    <option value="ALL">All Categories</option>
                    <option value="Police Administration">Police Administration</option>
                    <option value="Upper Administration">Upper Administration</option>
                    <option value="High Command">High Command</option>
                    <option value="Supervisors">Supervisors</option>
                    <option value="Patrol Units">Patrol Units</option>
                    <option value="Cadet">Cadet</option>
                </select>
                <select id="status-filter" class="bg-[#0f1115] border border-[#212630] rounded-lg px-3 py-2 text-sm text-slate-300 focus:outline-none focus:border-blue-500">
                    <option value="ALL">All Statuses</option>
                    <option value="Active">Active</option>
                    <option value="LOA">LOA</option>
                    <option value="Suspended">Suspended</option>
                </select>
            </div>

            <div class="flex items-center gap-3">
                <button id="export-csv" class="px-3.5 py-2 bg-[#0f1115] hover:bg-[#1a202c] border border-[#212630] rounded-lg text-xs font-semibold text-slate-300 transition flex items-center gap-2">
                    <i class="fa-solid fa-file-csv text-emerald-400"></i>
                    <span>Export CSV</span>
                </button>
                <button id="add-member-btn" class="hidden px-4 py-2 bg-blue-600 hover:bg-blue-500 text-white rounded-lg text-xs font-semibold shadow-lg shadow-blue-600/20 transition flex items-center gap-2">
                    <i class="fa-solid fa-plus"></i>
                    <span>Add Officer</span>
                </button>
            </div>
        </div>

        <div class="w-full bg-[#13161c] border border-[#222834] rounded-2xl shadow-2xl overflow-hidden my-6">
            <div class="px-6 py-4 border-b border-[#222834] flex items-center justify-between bg-[#171b23]">
                <span class="text-xs font-bold text-slate-300 tracking-wider uppercase">Personnel Roster Directory</span>
                <span id="active-group-indicator" class="text-xs font-semibold text-emerald-400 bg-emerald-500/10 px-3 py-1 rounded-full border border-emerald-500/20">Live View</span>
            </div>
            <div id="roster-container" class="divide-y divide-[#1c222d]"></div>
        </div>

    </main>

    <footer class="bg-[#12161d] border-t border-[#212630] py-4 mt-auto">
        <div class="max-w-7xl mx-auto px-4 text-center text-xs text-slate-500 flex flex-col sm:flex-row justify-between items-center gap-2">
            <span>Prime Legends Police Department &bull; Automated Roster System</span>
            <span class="text-slate-600 font-mono" id="view-mode-label">Public View Mode</span>
        </div>
    </footer>

    <div id="officer-modal" class="fixed inset-0 bg-[#0b0e14]/80 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
        <div class="bg-[#13161c] border border-[#222834] rounded-xl w-full max-w-lg overflow-hidden shadow-2xl">
            <div class="px-6 py-4 border-b border-[#222834] flex justify-between items-center bg-[#0f1115]">
                <h3 id="modal-title" class="font-bold text-slate-100 flex items-center gap-2">
                    <i class="fa-solid fa-user-plus text-blue-400"></i>
                    <span>Add New Officer</span>
                </h3>
                <button id="close-modal" class="text-slate-500 hover:text-slate-300 text-lg"><i class="fa-solid fa-xmark"></i></button>
            </div>

            <form id="officer-form" class="p-6 space-y-4">
                <input type="hidden" id="form-id">
                
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Badge NO</label>
                        <input type="text" id="form-badge" placeholder="e.g. C-2, M-0" class="w-full bg-[#0f1115] border border-[#222834] rounded-lg px-3 py-1.5 text-sm text-slate-200 focus:border-blue-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Officer Name</label>
                        <input type="text" id="form-name" required placeholder="e.g. Olise" class="w-full bg-[#0f1115] border border-[#222834] rounded-lg px-3 py-1.5 text-sm text-slate-200 focus:border-blue-500 outline-none">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Rank Title</label>
                        <select id="form-rank" class="w-full bg-[#0f1115] border border-[#222834] rounded-lg px-3 py-1.5 text-sm text-slate-200 focus:border-blue-500 outline-none">
                            <option value="Police Chief">Police Chief</option>
                            <option value="Vice Chief">Vice Chief</option>
                            <option value="Assistant Chief">Assistant Chief</option>
                            <option value="Deputy Chief">Deputy Chief</option>
                            <option value="Major">Major</option>
                            <option value="Captain">Captain</option>
                            <option value="Lieutenant II">Lieutenant II</option>
                            <option value="Lieutenant I">Lieutenant I</option>
                            <option value="Staff Sergeant">Staff Sergeant</option>
                            <option value="First Sergeant">First Sergeant</option>
                            <option value="Sergeant">Sergeant</option>
                            <option value="Senior Officer">Senior Officer</option>
                            <option value="Officer III">Officer III</option>
                            <option value="Officer II">Officer II</option>
                            <option value="Officer I">Officer I</option>
                            <option value="Solo Cadet">Solo Cadet</option>
                            <option value="Cadet">Cadet</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Category Group</label>
                        <select id="form-category" class="w-full bg-[#0f1115] border border-[#222834] rounded-lg px-3 py-1.5 text-sm text-slate-200 focus:border-blue-500 outline-none">
                            <option value="Police Administration">Police Administration</option>
                            <option value="Upper Administration">Upper Administration</option>
                            <option value="High Command">High Command</option>
                            <option value="Supervisors">Supervisors</option>
                            <option value="Patrol Units">Patrol Units</option>
                            <option value="Cadet">Cadet</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Responsibility</label>
                        <select id="form-responsibility" class="w-full bg-[#0f1115] border border-[#222834] rounded-lg px-3 py-1.5 text-sm text-slate-200 focus:border-blue-500 outline-none">
                            <option value="N/A">N/A</option>
                            <option value="Air Unit Leader">Air Unit Leader</option>
                            <option value="High Command">High Command</option>
                            <option value="Motorcycle Unit Leader">Motorcycle Unit Leader</option>
                            <option value="Detective">Detective</option>
                            <option value="FTO">FTO</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Duty Status</label>
                        <select id="form-status" class="w-full bg-[#0f1115] border border-[#222834] rounded-lg px-3 py-1.5 text-sm text-slate-200 focus:border-blue-500 outline-none">
                            <option value="Active">Active</option>
                            <option value="LOA">LOA (On Leave)</option>
                            <option value="Suspended">Suspended</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Discord ID</label>
                    <input type="text" id="form-discord" placeholder="18-digit ID" class="w-full bg-[#0f1115] border border-[#222834] rounded-lg px-3 py-1.5 text-sm text-slate-200 focus:border-blue-500 outline-none">
                </div>

                <div class="pt-4 border-t border-[#222834] flex justify-end gap-3">
                    <button type="button" id="cancel-modal" class="px-4 py-2 bg-[#1a202c] hover:bg-[#2d3748] text-slate-300 rounded-lg text-xs font-semibold">Cancel</button>
                    <button type="submit" class="px-5 py-2 bg-blue-600 hover:bg-blue-500 text-white rounded-lg text-xs font-semibold shadow-lg shadow-blue-600/20">Save Officer</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const API_URL = 'https://lspd-bot-production-1daf.up.railway.app/api/roster';
        const ADMIN_PASSWORD = "1444";

        let officers = [];
        let isAdmin = false;

        const rankOrder = {
            "Police Chief": 1,
            "Vice Chief": 2,
            "Assistant Chief": 3,
            "Deputy Chief": 4,
            "Major": 5,
            "Captain": 6,
            "Lieutenant II": 7,
            "Lieutenant I": 8,
            "Staff Sergeant": 9,
            "First Sergeant": 10,
            "Sergeant": 11,
            "Senior Officer": 12,
            "Officer III": 13,
            "Officer II": 14,
            "Officer I": 15,
            "Solo Cadet": 16,
            "Cadet": 17
        };

        const rosterContainer = document.getElementById('roster-container');
        const adminToggleBtn = document.getElementById('admin-toggle-btn');
        const addMemberBtn = document.getElementById('add-member-btn');
        const searchInput = document.getElementById('search-input');
        const rankFilter = document.getElementById('rank-filter');
        const statusFilter = document.getElementById('status-filter');
        const modal = document.getElementById('officer-modal');
        const officerForm = document.getElementById('officer-form');
        const viewModeLabel = document.getElementById('view-mode-label');

        function processOfficerBadgeAndName(rawName, rawBadge) {
            let badge = (rawBadge || '').trim();
            let name = (rawName || '').trim();

            const pattern = /^([A-Za-z0-9]+(?:-[A-Za-z0-9]+)?)\s*[\|-]?\s+(.+)$/i;
            const match = name.match(pattern);

            if (match) {
                badge = match[1].trim();
                name = match[2].trim();
            }

            return { 
                badge: badge || 'N/A', 
                name: name || rawName || 'Officer' 
            };
        }

        async function fetchLiveRoster() {
            try {
                const response = await fetch(API_URL);
                if (response.ok) {
                    const data = await response.json();
                    if (Array.isArray(data)) {
                        officers = data;
                        renderRoster();
                    }
                }
            } catch (error) {
                console.error('API Fetch Error:', error);
            }
        }

        function getRankWeight(rankName) {
            if (!rankName) return 99;
            for (let rank in rankOrder) {
                if (rankName.toLowerCase().trim() === rank.toLowerCase().trim()) {
                    return rankOrder[rank];
                }
            }
            return 99;
        }

        function renderRoster() {
            const query = searchInput.value.toLowerCase();
            const filterCat = rankFilter.value;
            const filterStat = statusFilter.value;

            const filtered = officers.filter(o => {
                const parsed = processOfficerBadgeAndName(o.name, o.badge);
                const badge = parsed.badge.toLowerCase();
                const name = parsed.name.toLowerCase();
                const rank = String(o.rank || '').toLowerCase();
                const resp = String(o.responsibility || '').toLowerCase();
                const discord = String(o.discord || '');

                const matchesSearch = name.includes(query) || 
                                      badge.includes(query) || 
                                      rank.includes(query) ||
                                      resp.includes(query) ||
                                      discord.includes(query);

                const isCadet = o.category === 'Cadet' || o.rank === 'Cadet' || o.rank === 'Solo Cadet';
                const matchesCat = filterCat === 'ALL' || (filterCat === 'Cadet' ? isCadet : o.category === filterCat);
                const matchesStat = filterStat === 'ALL' || (o.status || 'Active') === filterStat;

                return matchesSearch && matchesCat && matchesStat;
            });

            document.getElementById('stat-total').innerText = officers.length;
            document.getElementById('stat-active').innerText = officers.filter(o => o.status === 'Active' || !o.status).length;
            document.getElementById('stat-command').innerText = officers.filter(o => o.category === 'Police Administration' || o.category === 'Upper Administration' || o.category === 'High Command').length;

            const categories = [
                'Police Administration', 
                'Upper Administration', 
                'High Command', 
                'Supervisors', 
                'Patrol Units', 
                'Cadet'
            ];
            rosterContainer.innerHTML = '';

            if (filtered.length === 0) {
                rosterContainer.innerHTML = `
                    <div class="text-center py-16 px-4">
                        <i class="fa-solid fa-user-slash text-4xl text-slate-600 mb-3 block"></i>
                        <p class="text-slate-400 text-sm">No officers found matching your criteria.</p>
                    </div>
                `;
                return;
            }

            categories.forEach(cat => {
                let catOfficers = filtered.filter(o => {
                    if (cat === 'Cadet') {
                        return o.category === 'Cadet' || o.rank === 'Cadet' || o.rank === 'Solo Cadet';
                    }
                    return o.category === cat;
                });

                if (catOfficers.length === 0) return;

                catOfficers.sort((a, b) => {
                    const weightA = getRankWeight(a.rank);
                    const weightB = getRankWeight(b.rank);
                    if (weightA !== weightB) {
                        return weightA - weightB;
                    }
                    const badgeA = processOfficerBadgeAndName(a.name, a.badge).badge;
                    const badgeB = processOfficerBadgeAndName(b.name, b.badge).badge;
                    return badgeA.localeCompare(badgeB, undefined, { numeric: true, sensitivity: 'base' });
                });

                const headerDiv = document.createElement('div');
                headerDiv.className = 'px-6 py-3 bg-[#171b23] text-xs font-bold text-slate-300 tracking-wider uppercase border-b border-[#222834] flex justify-between items-center';
                headerDiv.innerHTML = `<span>${cat}</span><span class="text-[11px] text-slate-400 font-mono">${catOfficers.length} Personnel</span>`;
                rosterContainer.appendChild(headerDiv);

                catOfficers.forEach(o => {
                    const parsed = processOfficerBadgeAndName(o.name, o.badge);
                    const isRedBadge = parsed.badge.startsWith('P-') || parsed.badge.startsWith('A-') || parsed.badge.startsWith('T-');
                    
                    let statusLabel = 'ACTIVE';
                    let statusClass = 'text-emerald-400 bg-emerald-500/10 border-emerald-500/20';

                    if (o.status === 'Suspended') {
                        statusLabel = 'SUSPENDED';
                        statusClass = 'text-red-400 bg-red-500/10 border-red-500/20';
                    } else if (o.status === 'LOA') {
                        statusLabel = 'LOA';
                        statusClass = 'text-amber-400 bg-amber-500/10 border-amber-500/20';
                    }

                    const discordId = o.discord && o.discord !== 'N/A' ? o.discord : 'Not Linked';
                    const responsibility = o.responsibility && o.responsibility !== 'N/A' ? o.responsibility : null;

                    const itemRow = document.createElement('div');
                    itemRow.className = 'flex items-center justify-between px-6 py-4 hover:bg-[#181d27] transition border-b border-[#1c222d] last:border-b-0';
                    itemRow.innerHTML = `
                        <div class="flex items-center gap-6">
                            <span class="text-xs font-bold font-mono tracking-tight min-w-[42px] px-2 py-1 rounded bg-[#0f1115] border border-[#222834] text-center" style="color: ${isRedBadge ? '#f87171' : '#38bdf8'};">${parsed.badge}</span>
                            <div class="flex flex-col">
                                <span class="text-sm font-bold text-slate-100 tracking-wide">${parsed.name}</span>
                                <div class="flex items-center gap-2 mt-0.5">
                                    <span class="text-xs text-slate-400 font-medium">${o.rank || 'Cadet'}</span>
                                    ${responsibility ? `<span class="text-slate-600">&bull;</span><span class="text-[11px] text-blue-400 font-semibold bg-blue-500/10 px-2 py-0.5 rounded border border-blue-500/20">${responsibility}</span>` : ''}
                                </div>
                            </div>
                        </div>
                        <div class="flex items-center gap-6">
                            <div class="hidden sm:flex flex-col items-end font-mono">
                                <span class="text-[10px] text-slate-500 uppercase font-semibold">Discord ID</span>
                                <span class="text-xs text-slate-300">${discordId}</span>
                            </div>
                            <div class="px-2.5 py-1 rounded-full border text-[10px] font-bold tracking-wider ${statusClass}">
                                ${statusLabel}
                            </div>
                            ${isAdmin ? `
                                <div class="flex items-center gap-3 ml-2">
                                    <button onclick="editOfficer('${o.id}')" class="text-blue-400 hover:text-blue-300 text-xs"><i class="fa-solid fa-pen"></i></button>
                                    <button onclick="deleteOfficer('${o.id}')" class="text-red-400 hover:text-red-300 text-xs"><i class="fa-solid fa-trash"></i></button>
                                </div>
                            ` : ''}
                        </div>
                    `;
                    rosterContainer.appendChild(itemRow);
                });
            });
        }

        adminToggleBtn.addEventListener('click', () => {
            if (!isAdmin) {
                const password = prompt("Enter Admin Passcode:");
                if (password === ADMIN_PASSWORD) {
                    isAdmin = true;
                    adminToggleBtn.className = 'px-4 py-2 rounded-lg text-xs font-semibold bg-amber-500 text-slate-950 shadow-lg shadow-amber-500/20 transition flex items-center gap-2';
                    adminToggleBtn.innerHTML = '<i class="fa-solid fa-unlock"></i><span>Admin Mode Active</span>';
                    addMemberBtn.classList.remove('hidden');
                    viewModeLabel.innerText = 'Admin Control Active';
                    renderRoster();
                } else if (password !== null) {
                    alert("Incorrect Password!");
                }
            } else {
                isAdmin = false;
                adminToggleBtn.className = 'px-4 py-2 rounded-lg text-xs font-semibold bg-[#1a202c] hover:bg-[#2d3748] text-slate-200 border border-[#2d3748] transition flex items-center gap-2';
                adminToggleBtn.innerHTML = '<i class="fa-solid fa-lock text-amber-400"></i><span>Admin Mode</span>';
                addMemberBtn.classList.add('hidden');
                viewModeLabel.innerText = 'Public View Mode';
                renderRoster();
            }
        });

        searchInput.addEventListener('input', renderRoster);
        rankFilter.addEventListener('change', renderRoster);
        statusFilter.addEventListener('change', renderRoster);

        addMemberBtn.addEventListener('click', () => {
            officerForm.reset();
            document.getElementById('form-id').value = '';
            document.getElementById('modal-title').innerText = 'Add New Officer';
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        });

        document.getElementById('close-modal').addEventListener('click', closeModal);
        document.getElementById('cancel-modal').addEventListener('click', closeModal);

        function closeModal() {
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }

        officerForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('form-id').value;
            const rankVal = document.getElementById('form-rank').value;
            
            const officerPayload = {
                id: id ? id : String(Date.now()),
                badge: document.getElementById('form-badge').value,
                name: document.getElementById('form-name').value,
                rank: rankVal,
                category: document.getElementById('form-category').value,
                responsibility: document.getElementById('form-responsibility').value || 'N/A',
                status: document.getElementById('form-status').value,
                discord: document.getElementById('form-discord').value || 'N/A'
            };

            try {
                const method = id ? 'PUT' : 'POST';
                const endpoint = id ? `${API_URL}/${id}` : API_URL;
                
                const response = await fetch(endpoint, {
                    method: method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(officerPayload)
                });

                if (response.ok) {
                    await fetchLiveRoster();
                } else {
                    if (id) {
                        const idx = officers.findIndex(o => String(o.id) === String(id));
                        if (idx !== -1) officers[idx] = officerPayload;
                    } else {
                        officers.push(officerPayload);
                    }
                    renderRoster();
                }
            } catch (err) {
                console.warn('Backend update failed, performing local UI update', err);
                if (id) {
                    const idx = officers.findIndex(o => String(o.id) === String(id));
                    if (idx !== -1) officers[idx] = officerPayload;
                } else {
                    officers.push(officerPayload);
                }
                renderRoster();
            }

            closeModal();
        });

        window.editOfficer = function(id) {
            const officer = officers.find(o => String(o.id) === String(id));
            if (!officer) return;

            const parsed = processOfficerBadgeAndName(officer.name, officer.badge);

            document.getElementById('form-id').value = officer.id;
            document.getElementById('form-badge').value = parsed.badge;
            document.getElementById('form-name').value = parsed.name;
            document.getElementById('form-rank').value = officer.rank || 'Cadet';
            document.getElementById('form-category').value = officer.category || 'Cadet';
            document.getElementById('form-responsibility').value = officer.responsibility || 'N/A';
            document.getElementById('form-status').value = officer.status || 'Active';
            document.getElementById('form-discord').value = officer.discord || '';

            document.getElementById('modal-title').innerText = 'Edit Officer Record';
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        };

        window.deleteOfficer = async function(id) {
            if (confirm('Are you sure you want to delete this officer record?')) {
                try {
                    const response = await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
                    if (response.ok) {
                        await fetchLiveRoster();
                    } else {
                        officers = officers.filter(o => String(o.id) !== String(id));
                        renderRoster();
                    }
                } catch (err) {
                    officers = officers.filter(o => String(o.id) !== String(id));
                    renderRoster();
                }
            }
        };

        document.getElementById('export-csv').addEventListener('click', () => {
            let csv = 'Badge,Name,Rank,Category,Responsibility,Status,DiscordID\n';
            officers.forEach(o => {
                const parsed = processOfficerBadgeAndName(o.name, o.badge);
                csv += `"${parsed.badge}","${parsed.name}","${o.rank || ''}","${o.category || ''}","${o.responsibility || 'N/A'}","${o.status || 'Active'}","${o.discord || 'N/A'}"\n`;
            });
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.setAttribute('href', url);
            a.setAttribute('download', 'PLPD_Personnel_Roster.csv');
            a.click();
        });

        fetchLiveRoster();
        setInterval(fetchLiveRoster, 10000);
    </script>
</body>
</html>
