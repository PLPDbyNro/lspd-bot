<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Project Dashboard</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #050811;
            color: #f1f5f9;
            font-family: system-ui, -apple-system, sans-serif;
        }
        .blue-glow {
            box-shadow: 0 0 25px rgba(37, 99, 235, 0.15), inset 0 0 15px rgba(59, 130, 246, 0.05);
        }
        .indigo-glow {
            box-shadow: 0 0 25px rgba(99, 102, 241, 0.15), inset 0 0 15px rgba(99, 102, 241, 0.05);
        }
        .blue-border {
            border-color: rgba(59, 130, 246, 0.3);
        }
        .indigo-border {
            border-color: rgba(99, 102, 241, 0.3);
        }
        .silver-glow-rank {
            color: #e2e8f0;
            font-size: 1.05rem;
            font-weight: 600;
            text-shadow: 0 0 10px rgba(226, 232, 240, 0.4), 0 0 20px rgba(148, 163, 184, 0.2);
        }
    </style>
</head>
<body class="min-h-screen p-6">
    <div class="max-w-7xl mx-auto">
        
        <!-- Navigation Bar -->
        <nav class="flex flex-wrap justify-center md:justify-start gap-4 mb-8 border-b border-blue-900/40 pb-4">
            <button onclick="switchTab('police')" id="nav-police" class="px-6 py-2.5 rounded-xl font-bold transition cursor-pointer bg-blue-600 text-white shadow-lg shadow-blue-600/20">
                Legal Forces Roster
            </button>
            <button onclick="switchTab('special-units')" id="nav-special-units" class="px-6 py-2.5 rounded-xl font-bold transition cursor-pointer bg-slate-800 text-slate-400 hover:bg-slate-700 hover:text-white border border-indigo-500/20">
                Special Units Roster
            </button>
            <button onclick="switchTab('project2')" id="nav-project2" class="px-6 py-2.5 rounded-xl font-bold transition cursor-pointer bg-slate-800 text-slate-400 hover:bg-slate-700 hover:text-white border border-blue-500/20">
                Radio Protocols & Codes
            </button>
            <button onclick="switchTab('project3')" id="nav-project3" class="px-6 py-2.5 rounded-xl font-bold transition cursor-pointer bg-slate-800 text-slate-400 hover:bg-slate-700 hover:text-white border border-blue-500/20">
                Department Laws Summary
            </button>
        </nav>

        <!-- Tab 1: Legal Forces Roster -->
        <div id="tab-police" class="tab-content">
            <header class="flex flex-col md:flex-row justify-between items-center mb-8 border-b border-blue-900/40 pb-6">
                <div class="flex items-center gap-5">
                    <img src="logo.png" alt="Logo" class="w-16 h-16 rounded-2xl object-cover border-2 border-blue-500/40 blue-glow shadow-xl" onerror="this.style.display='none'">
                    <div>
                        <h1 class="text-2xl md:text-3xl font-extrabold tracking-tight text-white flex items-center gap-3">
                            <span class="w-3 h-3 rounded-full bg-blue-500 animate-pulse"></span>
                            The Legends Legal Forces Department Roster
                        </h1>
                        <p id="connection-status" class="text-xs text-blue-400 mt-1">Connecting to server...</p>
                    </div>
                </div>
                
                <div class="mt-4 md:mt-0 flex gap-3">
                    <button onclick="toggleAdminMode()" id="admin-btn" class="bg-slate-800 hover:bg-slate-700 text-blue-400 border border-blue-500/30 px-4 py-2.5 rounded-xl font-medium transition cursor-pointer flex items-center gap-2">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
                        <span id="admin-btn-text">Admin Mode (Locked)</span>
                    </button>

                    <button onclick="fetchLiveRoster()" class="bg-blue-600 hover:bg-blue-500 text-white px-5 py-2.5 rounded-xl font-medium transition shadow-lg shadow-blue-600/20 cursor-pointer flex items-center gap-2">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                        Refresh Data
                    </button>
                </div>
            </header>

            <div id="roster-container" class="space-y-8"></div>
        </div>

        <!-- Tab 2: Special Units Roster (NEW) -->
        <div id="tab-special-units" class="tab-content hidden">
            <header class="flex flex-col md:flex-row justify-between items-center mb-8 border-b border-indigo-900/40 pb-6">
                <div class="flex items-center gap-5">
                    <img src="logo.png" alt="Logo" class="w-16 h-16 rounded-2xl object-cover border-2 border-indigo-500/40 indigo-glow shadow-xl" onerror="this.style.display='none'">
                    <div>
                        <h1 class="text-2xl md:text-3xl font-extrabold tracking-tight text-white flex items-center gap-3">
                            <span class="w-3 h-3 rounded-full bg-indigo-500 animate-pulse"></span>
                            Special Tactical Units Roster (Discord Linked)
                        </h1>
                        <p id="special-connection-status" class="text-xs text-indigo-400 mt-1">Connecting to Special Units endpoint...</p>
                    </div>
                </div>
                
                <div class="mt-4 md:mt-0 flex gap-3">
                    <button onclick="fetchSpecialUnitsRoster()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-5 py-2.5 rounded-xl font-medium transition shadow-lg shadow-indigo-600/20 cursor-pointer flex items-center gap-2">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                        Refresh Special Units
                    </button>
                </div>
            </header>

            <div id="special-roster-container" class="space-y-8"></div>
        </div>

        <!-- Tab 3: Radio Protocols & Codes -->
        <div id="tab-project2" class="tab-content hidden space-y-10">
            <div class="mb-6">
                <h2 class="text-3xl font-extrabold text-white tracking-tight mb-2">Radio Protocols & Codes</h2>
                <p class="text-slate-400 text-sm">Radio calls, codes, how they are spoken, and what they mean.</p>
            </div>
        </div>

        <!-- Tab 4: Department Laws Summary -->
        <div id="tab-project3" class="tab-content hidden space-y-10">
            <div class="mb-6">
                <h2 class="text-3xl font-extrabold text-white tracking-tight">Department Laws Summary (1 to 16)</h2>
            </div>
        </div>

    </div>

    <script>
        const API_URL = 'https://lspd-bot-production-8924.up.railway.app/api/roster';
        const SPECIAL_API_URL = 'https://lspd-bot-production-8924.up.railway.app/api/special-units';

        let officers = [];
        let specialOfficers = [];
        let isAdmin = false;

        const CATEGORY_ORDER = [
            "Legal Forces",
            "Police Upper Administration",
            "Police Administration",
            "Supervisors",
            "Patrol Units",
            "Cadets"
        ];

        // Categories matching your special units configuration setup
        const SPECIAL_CATEGORY_ORDER = [
            "Tactical Command",
            "SWAT Operators",
            "Hostage Rescue Team",
            "Sniper Division",
            "Special Operatives"
        ];

        function switchTab(tabName) {
            const policeTab = document.getElementById('tab-police');
            const specialTab = document.getElementById('tab-special-units');
            const project2Tab = document.getElementById('tab-project2');
            const project3Tab = document.getElementById('tab-project3');
            
            const navPolice = document.getElementById('nav-police');
            const navSpecial = document.getElementById('nav-special-units');
            const navProject2 = document.getElementById('nav-project2');
            const navProject3 = document.getElementById('nav-project3');

            policeTab.classList.add('hidden');
            specialTab.classList.add('hidden');
            project2Tab.classList.add('hidden');
            project3Tab.classList.add('hidden');

            const defaultNavClass = "px-6 py-2.5 rounded-xl font-bold transition cursor-pointer bg-slate-800 text-slate-400 hover:bg-slate-700 hover:text-white border border-blue-500/20";
            const activeNavClass = "px-6 py-2.5 rounded-xl font-bold transition cursor-pointer bg-blue-600 text-white shadow-lg shadow-blue-600/20";
            const activeSpecialNavClass = "px-6 py-2.5 rounded-xl font-bold transition cursor-pointer bg-indigo-600 text-white shadow-lg shadow-indigo-600/20";

            navPolice.className = defaultNavClass;
            navSpecial.className = defaultNavClass;
            navProject2.className = defaultNavClass;
            navProject3.className = defaultNavClass;

            if (tabName === 'police') {
                policeTab.classList.remove('hidden');
                navPolice.className = activeNavClass;
            } else if (tabName === 'special-units') {
                specialTab.classList.remove('hidden');
                navSpecial.className = activeSpecialNavClass;
                fetchSpecialUnitsRoster();
            } else if (tabName === 'project2') {
                project2Tab.classList.remove('hidden');
                navProject2.className = activeNavClass;
            } else if (tabName === 'project3') {
                project3Tab.classList.remove('hidden');
                navProject3.className = activeNavClass;
            }
        }

        function toggleAdminMode() {
            if (isAdmin) {
                isAdmin = false;
                document.getElementById('admin-btn-text').textContent = 'Admin Mode (Locked)';
                document.getElementById('admin-btn').className = 'bg-slate-800 hover:bg-slate-700 text-blue-400 border border-blue-500/30 px-4 py-2.5 rounded-xl font-medium transition cursor-pointer flex items-center gap-2';
                alert('تم إيقاف وضع المشرف بنجاح.');
                renderRoster();
            } else {
                const password = prompt('الرجاء إدخال الرمز السري للمشرف:');
                if (password === '1444') {
                    isAdmin = true;
                    document.getElementById('admin-btn-text').textContent = 'Admin Mode (Active)';
                    document.getElementById('admin-btn').className = 'bg-emerald-600 hover:bg-emerald-500 text-white border border-emerald-500/30 px-4 py-2.5 rounded-xl font-medium transition cursor-pointer flex items-center gap-2';
                    alert('مرحباً بك، تم تفعيل وضع المشرف بنجاح!');
                    renderRoster();
                } else if (password !== null) {
                    alert('الرمز السري غير صحيح!');
                }
            }
        }

        async function fetchLiveRoster() {
            const statusEl = document.getElementById('connection-status');
            statusEl.textContent = 'Fetching data from server...';
            statusEl.className = 'text-xs text-blue-300 mt-1';

            try {
                const response = await fetch(API_URL);
                if (!response.ok) throw new Error(`Server returned status ${response.status}`);
                
                officers = await response.json();
                statusEl.textContent = `Connected successfully (${officers.length} records found)`;
                statusEl.className = 'text-xs text-emerald-400 mt-1 font-semibold';
                renderRoster();
            } catch (err) {
                console.error('Error fetching live roster:', err);
                statusEl.textContent = `Connection Error: Check Railway Backend`;
                statusEl.className = 'text-xs text-rose-400 mt-1';
                renderRoster();
            }
        }

        async function fetchSpecialUnitsRoster() {
            const statusEl = document.getElementById('special-connection-status');
            statusEl.textContent = 'Fetching Discord Special Units data...';
            statusEl.className = 'text-xs text-indigo-300 mt-1';

            try {
                const response = await fetch(SPECIAL_API_URL);
                if (!response.ok) throw new Error(`Server returned status ${response.status}`);
                
                specialOfficers = await response.json();
                statusEl.textContent = `Discord Connected Successfully (${specialOfficers.length} operatives found)`;
                statusEl.className = 'text-xs text-emerald-400 mt-1 font-semibold';
                renderSpecialRoster();
            } catch (err) {
                console.error('Error fetching special units roster:', err);
                statusEl.textContent = `Connection Error: Verify endpoint configuration`;
                statusEl.className = 'text-xs text-rose-400 mt-1';
                renderSpecialRoster();
            }
        }

        function renderRoster() {
            const container = document.getElementById('roster-container');
            container.innerHTML = '';

            if (!Array.isArray(officers) || officers.length === 0) {
                container.innerHTML = `
                    <div class="bg-slate-900/80 border blue-border rounded-2xl p-12 text-center text-slate-400 blue-glow">
                        <p class="font-medium text-lg text-slate-200">No personnel records found from the server.</p>
                    </div>`;
                return;
            }

            const grouped = {};
            CATEGORY_ORDER.forEach(cat => grouped[cat] = []);

            officers.forEach(officer => {
                const cat = officer.category && grouped[officer.category] ? officer.category : "Cadets";
                grouped[cat].push(officer);
            });

            CATEGORY_ORDER.forEach(categoryName => {
                const catOfficers = grouped[categoryName];
                if (!catOfficers || catOfficers.length === 0) return;

                const sectionDiv = document.createElement('div');
                sectionDiv.className = 'bg-slate-900/70 border blue-border rounded-2xl shadow-xl overflow-hidden blue-glow backdrop-blur-md';
                
                let rowsHtml = '';
                catOfficers.forEach(officer => {
                    const actionButtonHtml = isAdmin ? `
                        <button onclick="deleteOfficer('${officer.id}')" class="text-rose-400 hover:text-rose-300 font-medium text-sm transition cursor-pointer px-3 py-1 rounded-lg hover:bg-rose-500/10">
                            Delete
                        </button>
                    ` : `<span class="text-slate-500 text-xs italic">Locked</span>`;

                    rowsHtml += `
                        <tr class="hover:bg-blue-950/20 transition border-b border-black/60 last:border-none">
                            <td class="py-4 px-6 flex items-center gap-3">
                                <img src="${officer.avatar || 'https://via.placeholder.com/40'}" alt="" class="w-10 h-10 rounded-full bg-slate-800 object-cover border border-blue-500/30">
                                <span class="font-semibold text-slate-100">${officer.name || 'Unknown'}</span>
                            </td>
                            <td class="py-4 px-6 silver-glow-rank">${officer.rank || 'Member'}</td>
                            <td class="py-4 px-6 text-blue-400 font-mono text-sm font-bold">[${officer.badge || 'N/A'}]</td>
                            <td class="py-4 px-6">
                                <span class="px-3 py-1 text-xs rounded-full font-medium bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
                                    ${officer.status || 'Active'}
                                </span>
                            </td>
                            <td class="py-4 px-6 text-right">
                                ${actionButtonHtml}
                            </td>
                        </tr>
                    `;
                });

                sectionDiv.innerHTML = `
                    <div class="bg-gradient-to-r from-blue-950/60 via-slate-900 to-slate-900 px-6 py-4 border-b border-blue-900/30 flex justify-between items-center">
                        <h2 class="text-lg font-bold text-blue-200 tracking-wide flex items-center gap-2">
                            <span class="w-2 h-2 rounded-full bg-blue-500"></span>
                            ${categoryName}
                        </h2>
                        <span class="text-xs px-2.5 py-1 rounded-full bg-blue-500/10 text-blue-300 border border-blue-500/20 font-medium">
                            ${catOfficers.length} Members
                        </span>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="bg-slate-950/40 text-slate-400 uppercase text-xs tracking-wider border-b border-black">
                                    <th class="py-3 px-6">Officer / Member</th>
                                    <th class="py-3 px-6">Rank</th>
                                    <th class="py-3 px-6">Badge / ID</th>
                                    <th class="py-3 px-6">Status</th>
                                    <th class="py-3 px-6 text-right">Actions</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-black/60">
                                ${rowsHtml}
                            </tbody>
                        </table>
                    </div>
                `;

                container.appendChild(sectionDiv);
            });
        }

        function renderSpecialRoster() {
            const container = document.getElementById('special-roster-container');
            container.innerHTML = '';

            if (!Array.isArray(specialOfficers) || specialOfficers.length === 0) {
                container.innerHTML = `
                    <div class="bg-slate-900/80 border indigo-border rounded-2xl p-12 text-center text-slate-400 indigo-glow">
                        <p class="font-medium text-lg text-slate-200">No Special Units records retrieved from Discord bot API.</p>
                    </div>`;
                return;
            }

            const grouped = {};
            SPECIAL_CATEGORY_ORDER.forEach(cat => grouped[cat] = []);

            specialOfficers.forEach(operative => {
                const cat = operative.category && grouped[operative.category] ? operative.category : "Special Operatives";
                grouped[cat].push(operative);
            });

            SPECIAL_CATEGORY_ORDER.forEach(categoryName => {
                const catOperatives = grouped[categoryName];
                if (!catOperatives || catOperatives.length === 0) return;

                const sectionDiv = document.createElement('div');
                sectionDiv.className = 'bg-slate-900/70 border indigo-border rounded-2xl shadow-xl overflow-hidden indigo-glow backdrop-blur-md';
                
                let rowsHtml = '';
                catOperatives.forEach(operative => {
                    rowsHtml += `
                        <tr class="hover:bg-indigo-950/20 transition border-b border-black/60 last:border-none">
                            <td class="py-4 px-6 flex items-center gap-3">
                                <img src="${operative.avatar || 'https://via.placeholder.com/40'}" alt="" class="w-10 h-10 rounded-full bg-slate-800 object-cover border border-indigo-500/30">
                                <div>
                                    <span class="font-semibold text-slate-100 block">${operative.name || 'Unknown'}</span>
                                    <span class="text-xs text-slate-400 font-mono">Discord ID: ${operative.discordId || 'N/A'}</span>
                                </div>
                            </td>
                            <td class="py-4 px-6 text-indigo-200 font-semibold">${operative.rank || 'Operative'}</td>
                            <td class="py-4 px-6 text-indigo-400 font-mono text-sm font-bold">[${operative.badge || 'N/A'}]</td>
                            <td class="py-4 px-6">
                                <span class="px-3 py-1 text-xs rounded-full font-medium bg-indigo-500/10 text-indigo-400 border border-indigo-500/20">
                                    ${operative.status || 'Active Duty'}
                                </span>
                            </td>
                        </tr>
                    `;
                });

                sectionDiv.innerHTML = `
                    <div class="bg-gradient-to-r from-indigo-950/60 via-slate-900 to-slate-900 px-6 py-4 border-b border-indigo-900/30 flex justify-between items-center">
                        <h2 class="text-lg font-bold text-indigo-200 tracking-wide flex items-center gap-2">
                            <span class="w-2 h-2 rounded-full bg-indigo-500"></span>
                            ${categoryName}
                        </h2>
                        <span class="text-xs px-2.5 py-1 rounded-full bg-indigo-500/10 text-indigo-300 border border-indigo-500/20 font-medium">
                            ${catOperatives.length} Operatives
                        </span>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="bg-slate-950/40 text-slate-400 uppercase text-xs tracking-wider border-b border-black">
                                    <th class="py-3 px-6">Operative Details</th>
                                    <th class="py-3 px-6">Tactical Rank</th>
                                    <th class="py-3 px-6">Discord Role ID / Badge</th>
                                    <th class="py-3 px-6">Status</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-black/60">
                                ${rowsHtml}
                            </tbody>
                        </table>
                    </div>
                `;

                container.appendChild(sectionDiv);
            });
        }

        // Initial load for the default active tab
        fetchLiveRoster();
    </script>
</body>
</html>
