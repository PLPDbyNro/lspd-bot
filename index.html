<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prime Legends Police Department - Personnel Roster</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased min-h-screen flex flex-col">

    <!-- Top Navigation Header -->
    <header class="bg-slate-900/90 backdrop-blur border-b border-slate-800 sticky top-0 z-50 shadow-lg">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            <div class="flex items-center gap-4">
                <!-- Prime Legends Logo -->
                <div class="relative group">
                    <img src="logo.png" alt="Prime Legends Logo" class="h-14 w-auto object-contain drop-shadow-[0_0_10px_rgba(59,130,246,0.5)] transition-transform duration-300 group-hover:scale-105" onerror="this.src='https://via.placeholder.com/60?text=PLPD'">
                </div>
                <div>
                    <h1 class="font-black text-xl tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-blue-400 via-indigo-200 to-amber-300">
                        PRIME LEGENDS POLICE DEPARTMENT
                    </h1>
                    <span class="text-xs text-slate-400 font-mono tracking-widest uppercase flex items-center gap-2">
                        <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                        Official Personnel Roster
                    </span>
                </div>
            </div>

            <!-- Stats Bar & Mode Toggle -->
            <div class="flex items-center gap-4">
                <div class="hidden md:flex items-center gap-6 bg-slate-950/80 px-4 py-2 rounded-xl border border-slate-800 text-xs shadow-inner">
                    <div>
                        <span class="text-slate-500 uppercase block text-[10px] font-semibold">إجمالي الضباط</span>
                        <span id="stat-total" class="font-bold text-blue-400 text-sm">0</span>
                    </div>
                    <div class="w-px h-6 bg-slate-800"></div>
                    <div>
                        <span class="text-slate-500 uppercase block text-[10px] font-semibold">في الخدمة</span>
                        <span id="stat-active" class="font-bold text-emerald-400 text-sm">0</span>
                    </div>
                    <div class="w-px h-6 bg-slate-800"></div>
                    <div>
                        <span class="text-slate-500 uppercase block text-[10px] font-semibold">القيادة العليا</span>
                        <span id="stat-command" class="font-bold text-amber-400 text-sm">0</span>
                    </div>
                </div>

                <button id="admin-toggle-btn" class="px-4 py-2 rounded-lg text-xs font-semibold bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 transition flex items-center gap-2 shadow-md">
                    <i class="fa-solid fa-lock text-amber-400"></i>
                    <span>Admin Mode</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content Layout -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-6">

        <!-- Controls Toolbar -->
        <div class="flex flex-col md:flex-row gap-4 justify-between items-stretch md:items-center bg-slate-900 p-4 rounded-xl border border-slate-800 shadow-xl">
            <!-- Search & Filters -->
            <div class="flex flex-1 flex-col sm:flex-row gap-3">
                <div class="relative flex-1">
                    <i class="fa-solid fa-magnifying-glass absolute right-3.5 top-1/2 -translate-y-1/2 text-slate-500 text-sm"></i>
                    <input type="text" id="search-input" placeholder="بحث عن ضابط، الرقم العسكري، أو Discord ID..." class="w-full bg-slate-950 border border-slate-800 rounded-lg pr-10 pl-4 py-2 text-sm text-slate-200 placeholder-slate-500 focus:outline-none focus:border-blue-500 transition">
                </div>
                <select id="rank-filter" class="bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm text-slate-300 focus:outline-none focus:border-blue-500">
                    <option value="ALL">جميع الأقسام</option>
                    <option value="Police Administration">Police Administration</option>
                    <option value="Upper Administration">Upper Administration</option>
                    <option value="High Command">High Command</option>
                    <option value="Supervisors">Supervisors</option>
                    <option value="Patrol Units">Patrol Units</option>
                    <option value="Cadet">Cadet</option>
                </select>
            </div>

            <!-- Action Buttons -->
            <div class="flex items-center gap-3">
                <button id="export-csv" class="px-3.5 py-2 bg-slate-950 hover:bg-slate-800 border border-slate-800 rounded-lg text-xs font-semibold text-slate-300 transition flex items-center gap-2">
                    <i class="fa-solid fa-file-csv text-emerald-400"></i>
                    <span>تصدير CSV</span>
                </button>
                <button id="add-member-btn" class="hidden px-4 py-2 bg-blue-600 hover:bg-blue-500 text-white rounded-lg text-xs font-semibold shadow-lg shadow-blue-600/20 transition flex items-center gap-2">
                    <i class="fa-solid fa-plus"></i>
                    <span>إضافة ضابط</span>
                </button>
            </div>
        </div>

        <!-- Roster Data Container -->
        <div id="roster-container" class="space-y-6">
            <!-- Dynamic Sections Rendered Here -->
        </div>

    </main>

    <!-- Footer -->
    <footer class="bg-slate-900 border-t border-slate-800 py-4 mt-auto">
        <div class="max-w-7xl mx-auto px-4 text-center text-xs text-slate-500 flex flex-col sm:flex-row justify-between items-center gap-2">
            <span>Prime Legends Police Department &bull; Automated Roster System</span>
            <span class="text-slate-600 font-mono">Public View Mode</span>
        </div>
    </footer>

    <!-- Add/Edit Officer Modal -->
    <div id="officer-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
        <div class="bg-slate-900 border border-slate-800 rounded-xl w-full max-w-lg overflow-hidden shadow-2xl">
            <div class="px-6 py-4 border-b border-slate-800 flex justify-between items-center bg-slate-950/50">
                <h3 id="modal-title" class="font-bold text-slate-100 flex items-center gap-2">
                    <i class="fa-solid fa-user-plus text-blue-400"></i>
                    <span>إضافة ضابط جديد</span>
                </h3>
                <button id="close-modal" class="text-slate-500 hover:text-slate-300 text-lg"><i class="fa-solid fa-xmark"></i></button>
            </div>

            <form id="officer-form" class="p-6 space-y-4">
                <input type="hidden" id="form-id">
                
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">الرقم العسكري (Badge)</label>
                        <input type="text" id="form-badge" placeholder="مثال: T-0, C-2" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-1.5 text-sm text-slate-200 focus:border-blue-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">اسم الضابط</label>
                        <input type="text" id="form-name" required placeholder="مثال: Faycel" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-1.5 text-sm text-slate-200 focus:border-blue-500 outline-none">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">الرتبة</label>
                        <select id="form-rank" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-1.5 text-sm text-slate-200 focus:border-blue-500 outline-none">
                            <option value="Police Chief">Police Chief</option>
                            <option value="Vice Chief">Vice Chief</option>
                            <option value="Assistant Chief">Assistant Chief</option>
                            <option value="Deputy Chief">Deputy Chief</option>
                            <option value="Major">Major</option>
                            <option value="Captain">Captain</option>
                            <option value="Lieutenant II">Lieutenant II</option>
                            <option value="Lieutenant I">Lieutenant I</option>
                            <option value="Staff Sergeant">Staff Sergeant</option>
                            <option value="First Sergeant">First Sergeant</option>
                            <option value="Sergeant">Sergeant</option>
                            <option value="Senior Officer">Senior Officer</option>
                            <option value="Officer III">Officer III</option>
                            <option value="Officer II">Officer II</option>
                            <option value="Officer I">Officer I</option>
                            <option value="Solo Cadet">Solo Cadet</option>
                            <option value="Cadet">Cadet</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">الفئة</label>
                        <select id="form-category" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-1.5 text-sm text-slate-200 focus:border-blue-500 outline-none">
                            <option value="Police Administration">Police Administration</option>
                            <option value="Upper Administration">Upper Administration</option>
                            <option value="High Command">High Command</option>
                            <option value="Supervisors">Supervisors</option>
                            <option value="Patrol Units">Patrol Units</option>
                            <option value="Cadet">Cadet</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">المهام / المسؤولية</label>
                        <input type="text" id="form-responsibility" placeholder="مثال: FTO, Air Unit" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-1.5 text-sm text-slate-200 focus:border-blue-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">حالة الخدمة</label>
                        <select id="form-status" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-1.5 text-sm text-slate-200 focus:border-blue-500 outline-none">
                            <option value="Active">Active</option>
                            <option value="LOA">LOA (إجازة)</option>
                            <option value="Suspended">Suspended (موقوف)</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">عدد الإنذارات (Strikes)</label>
                        <input type="number" id="form-strikes" min="0" max="3" value="0" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-1.5 text-sm text-slate-200 focus:border-blue-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Discord ID</label>
                        <input type="text" id="form-discord" placeholder="معرف الديسكورد" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-1.5 text-sm text-slate-200 focus:border-blue-500 outline-none">
                    </div>
                </div>

                <div class="pt-4 border-t border-slate-800 flex justify-end gap-3">
                    <button type="button" id="cancel-modal" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg text-xs font-semibold">إلغاء</button>
                    <button type="submit" class="px-5 py-2 bg-blue-600 hover:bg-blue-500 text-white rounded-lg text-xs font-semibold shadow-lg shadow-blue-600/20">حفظ الضابط</button>
                </div>
            </form>
        </div>
    </div>

    <!-- JavaScript Logic -->
    <script>
        const ADMIN_PASSWORD_HASH = "14e7a79a613b5308d28f0ee8333334f590123530e3bb45db474a00501a3cf838";

        async function hashPassword(password) {
            const msgUint8 = new TextEncoder().encode(password);
            const hashBuffer = await crypto.subtle.digest('SHA-256', msgUint8);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

        let officers = [];
        let isAdmin = false;

        const rankOrder = {
            "Police Chief": 1, "Vice Chief": 2, "Assistant Chief": 3, "Deputy Chief": 4,
            "Major": 5, "Captain": 6, "Lieutenant II": 7, "Lieutenant I": 8,
            "Staff Sergeant": 9, "First Sergeant": 10, "Sergeant": 11, "Senior Officer": 12,
            "Officer III": 13, "Officer II": 14, "Officer I": 15, "Solo Cadet": 16, "Cadet": 17
        };

        const rosterContainer = document.getElementById('roster-container');
        const adminToggleBtn = document.getElementById('admin-toggle-btn');
        const addMemberBtn = document.getElementById('add-member-btn');
        const searchInput = document.getElementById('search-input');
        const rankFilter = document.getElementById('rank-filter');
        const modal = document.getElementById('officer-modal');
        const officerForm = document.getElementById('officer-form');

        function processOfficerBadgeAndName(rawName, rawBadge) {
            let badge = (rawBadge || '').trim();
            let name = (rawName || '').trim();
            const pattern = /^([A-Za-z0-9]+-[0-9]+|[A-Za-z0-9]+-[A-Za-z0-9]+|[0-9]+)\s*[\|-]?\s*(.+)$/i;
            const match = name.match(pattern);

            if (match) {
                if (!badge || badge === 'N/A' || badge.endsWith('-')) {
                    badge = match[1].trim();
                }
                name = match[2].trim();
            }

            return { badge: badge || 'N/A', name: name || 'Officer' };
        }

        function saveToLocalStorage() {
            localStorage.setItem('plpd_officers_data', JSON.stringify(officers));
        }

        async function fetchLiveRoster() {
            const localData = localStorage.getItem('plpd_officers_data');
            if (localData && officers.length === 0) {
                try {
                    officers = JSON.parse(localData);
                    renderRoster();
                } catch(e) { console.error("Error reading LocalStorage", e); }
            }

            try {
                const response = await fetch('https://lspd-bot-production-1daf.up.railway.app/api/roster');
                if (response.ok) {
                    const data = await response.json();
                    if (Array.isArray(data) && data.length > 0) {
                        officers = data;
                        saveToLocalStorage();
                        renderRoster();
                    }
                }
            } catch (error) {
                console.warn('API Fetch failed, using local/cached data:', error);
                if (officers.length > 0) renderRoster();
            }
        }

        function renderInsignia(type) {
            switch(type) {
                case '5star': return '<span class="text-amber-400 font-bold">★★★★★</span>';
                case '4star': return '<span class="text-amber-400 font-bold">★★★★</span>';
                case '3star': return '<span class="text-amber-400 font-bold">★★★</span>';
                case '1star': return '<span class="text-amber-400 font-bold">★</span>';
                case 'bars2': return '<span class="text-slate-300 font-bold">❚❚</span>';
                case 'bar1gold': return '<span class="text-amber-500 font-bold">❚</span>';
                case 'bar1silver': return '<span class="text-slate-300 font-bold">❚</span>';
                case 'chevrons4': return '<span class="text-slate-300 font-bold">⤊⤊</span>';
                case 'chevrons3': return '<span class="text-slate-300 font-bold">⤊^</span>';
                case 'chevrons2': return '<span class="text-slate-300 font-bold">⤊</span>';
                case 'diamonds': return '<span class="text-slate-400">❖</span>';
                case 'cadet': return '<span class="text-slate-500">◇</span>';
                default: return '<span class="text-slate-500">^</span>';
            }
        }

        function getRankWeight(rankName) {
            if (!rankName) return 99;
            for (let rank in rankOrder) {
                if (rankName.toLowerCase().trim() === rank.toLowerCase().trim()) return rankOrder[rank];
            }
            return 99;
        }

        function renderRoster() {
            const query = searchInput.value.toLowerCase().trim();
            const filterCat = rankFilter.value;

            const filtered = officers.filter(o => {
                const parsed = processOfficerBadgeAndName(o.name, o.badge);
                const badge = parsed.badge.toLowerCase();
                const name = parsed.name.toLowerCase();
                const discord = String(o.discord || '');

                const matchesSearch = name.includes(query) || badge.includes(query) || discord.includes(query);
                const matchesCat = filterCat === 'ALL' || o.category === filterCat;
                return matchesSearch && matchesCat;
            });

            document.getElementById('stat-total').innerText = officers.length;
            document.getElementById('stat-active').innerText = officers.filter(o => o.status === 'Active').length;
            document.getElementById('stat-command').innerText = officers.filter(o => ['Police Administration', 'Upper Administration', 'High Command'].includes(o.category)).length;

            const categories = ['Police Administration', 'Upper Administration', 'High Command', 'Supervisors', 'Patrol Units', 'Cadet'];
            rosterContainer.innerHTML = '';

            if (filtered.length === 0) {
                rosterContainer.innerHTML = `
                    <div class="text-center py-12 bg-slate-900 rounded-xl border border-slate-800">
                        <i class="fa-solid fa-user-slash text-4xl text-slate-600 mb-3 block"></i>
                        <p class="text-slate-400 font-medium text-sm">لم يتم العثور على ضباط يطابقون خيارات البحث.</p>
                    </div>
                `;
                return;
            }

            categories.forEach(cat => {
                let catOfficers = filtered.filter(o => o.category === cat);
                if (catOfficers.length === 0) return;

                catOfficers.sort((a, b) => {
                    const weightA = getRankWeight(a.rank);
                    const weightB = getRankWeight(b.rank);
                    if (weightA !== weightB) return weightA - weightB;
                    const badgeA = processOfficerBadgeAndName(a.name, a.badge).badge;
                    const badgeB = processOfficerBadgeAndName(b.name, b.badge).badge;
                    return badgeA.localeCompare(badgeB, undefined, { numeric: true, sensitivity: 'base' });
                });

                const section = document.createElement('div');
                section.className = 'bg-slate-900 border border-slate-800 rounded-xl overflow-hidden shadow-lg';

                let rowsHtml = catOfficers.map(o => {
                    const parsed = processOfficerBadgeAndName(o.name, o.badge);
                    const isRedBadge = parsed.badge.startsWith('P-') || parsed.badge.startsWith('A-') || parsed.badge.startsWith('T-');
                    return `
                    <tr class="border-b border-slate-800/60 hover:bg-slate-800/40 transition">
                        <td class="px-4 py-3 text-xs font-mono font-bold ${isRedBadge ? 'text-red-400' : 'text-blue-400'}">${parsed.badge}</td>
                        <td class="px-4 py-3 text-sm font-semibold text-slate-100">${parsed.name}</td>
                        <td class="px-4 py-3 text-xs font-medium text-amber-400/90">${o.rank || 'غير محدد'}</td>
                        <td class="px-4 py-3 text-xs text-slate-400">${o.responsibility || 'N/A'}</td>
                        <td class="px-4 py-3 text-xs text-center">${renderInsignia(o.insignia)}</td>
                        <td class="px-4 py-3 text-xs text-center">
                            <span class="px-2 py-0.5 rounded-full text-[10px] font-semibold ${o.status === 'Active' ? 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20' : 'bg-red-500/10 text-red-400'}">${o.status || 'Active'}</span>
                        </td>
                        <td class="px-4 py-3 text-xs text-center font-mono ${o.strikes > 0 ? 'text-red-400 font-bold' : 'text-slate-500'}">${o.strikes || 0}</td>
                        <td class="px-4 py-3 text-xs font-mono text-slate-400">${o.discord || o.id}</td>
                        ${isAdmin ? `
                            <td class="px-4 py-3 text-xs text-left space-x-2 space-x-reverse">
                                <button onclick="editOfficer('${o.id}')" class="text-blue-400 hover:text-blue-300 p-1"><i class="fa-solid fa-pen"></i></button>
                                <button onclick="deleteOfficer('${o.id}')" class="text-red-400 hover:text-red-300 p-1"><i class="fa-solid fa-trash"></i></button>
                            </td>
                        ` : ''}
                    </tr>
                `}).join('');

                section.innerHTML = `
                    <div class="bg-slate-950 px-4 py-3 border-b border-slate-800 flex justify-between items-center">
                        <h2 class="text-sm font-bold tracking-wide uppercase text-slate-300 flex items-center gap-2">
                            <span class="w-2 h-2 rounded-full ${cat === 'Police Administration' ? 'bg-amber-500' : 'bg-blue-500'}"></span>
                            ${cat}
                        </h2>
                        <span class="text-xs font-mono text-slate-500">${catOfficers.length} أعضاء</span>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="w-full text-right border-collapse">
                            <thead>
                                <tr class="bg-slate-900/50 text-[11px] font-semibold text-slate-500 uppercase border-b border-slate-800">
                                    <th class="px-4 py-2">Badge</th>
                                    <th class="px-4 py-2">الاسم</th>
                                    <th class="px-4 py-2">الرتبة</th>
                                    <th class="px-4 py-2">المسؤولية</th>
                                    <th class="px-4 py-2 text-center">الشارة</th>
                                    <th class="px-4 py-2 text-center">الحالة</th>
                                    <th class="px-4 py-2 text-center">الإنذارات</th>
                                    <th class="px-4 py-2">Discord ID</th>
                                    ${isAdmin ? '<th class="px-4 py-2 text-left">إجراءات</th>' : ''}
                                </tr>
                            </thead>
                            <tbody>${rowsHtml}</tbody>
                        </table>
                    </div>
                `;
                rosterContainer.appendChild(section);
            });
        }

        adminToggleBtn.addEventListener('click', async () => {
            if (!isAdmin) {
                const password = prompt("الرجاء إدخال كلمة السر الخاصة بـ Admin Mode:");
                if (password !== null) {
                    const inputHash = await hashPassword(password);
                    if (inputHash === ADMIN_PASSWORD_HASH) {
                        isAdmin = true;
                        adminToggleBtn.className = 'px-4 py-2 rounded-lg text-xs font-semibold bg-amber-500 text-slate-950 shadow-lg shadow-amber-500/20 transition flex items-center gap-2';
                        adminToggleBtn.innerHTML = '<i class="fa-solid fa-unlock"></i><span>Admin Mode Active</span>';
                        addMemberBtn.classList.remove('hidden');
                        renderRoster();
                    } else {
                        alert("كلمة السر غير صحيحة!");
                    }
                }
            } else {
                isAdmin = false;
                adminToggleBtn.className = 'px-4 py-2 rounded-lg text-xs font-semibold bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 transition flex items-center gap-2';
                adminToggleBtn.innerHTML = '<i class="fa-solid fa-lock text-amber-400"></i><span>Admin Mode</span>';
                addMemberBtn.classList.add('hidden');
                renderRoster();
            }
        });

        searchInput.addEventListener('input', renderRoster);
        rankFilter.addEventListener('change', renderRoster);

        addMemberBtn.addEventListener('click', () => {
            officerForm.reset();
            document.getElementById('form-id').value = '';
            document.getElementById('modal-title').innerText = 'إضافة ضابط جديد';
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        });

        document.getElementById('close-modal').addEventListener('click', closeModal);
        document.getElementById('cancel-modal').addEventListener('click', closeModal);

        function closeModal() {
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }

        officerForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const id = document.getElementById('form-id').value;
            const newOfficer = {
                id: id ? id : String(Date.now()),
                badge: document.getElementById('form-badge').value,
                name: document.getElementById('form-name').value,
                rank: document.getElementById('form-rank').value,
                category: document.getElementById('form-category').value,
                responsibility: document.getElementById('form-responsibility').value || 'N/A',
                insignia: 'chevrons2',
                status: document.getElementById('form-status').value,
                strikes: parseInt(document.getElementById('form-strikes').value) || 0,
                discord: document.getElementById('form-discord').value || 'N/A'
            };

            if (id) {
                const index = officers.findIndex(o => String(o.id) === String(id));
                if (index !== -1) officers[index] = newOfficer;
            } else {
                officers.push(newOfficer);
            }

            saveToLocalStorage();
            closeModal();
            renderRoster();
        });

        window.editOfficer = function(id) {
            const officer = officers.find(o => String(o.id) === String(id));
            if (!officer) return;

            const parsed = processOfficerBadgeAndName(officer.name, officer.badge);

            document.getElementById('form-id').value = officer.id;
            document.getElementById('form-badge').value = parsed.badge;
            document.getElementById('form-name').value = parsed.name;
            document.getElementById('form-rank').value = officer.rank || 'Officer I';
            document.getElementById('form-category').value = officer.category || 'Patrol Units';
            document.getElementById('form-responsibility').value = officer.responsibility || '';
            document.getElementById('form-status').value = officer.status || 'Active';
            document.getElementById('form-strikes').value = officer.strikes || 0;
            document.getElementById('form-discord').value = officer.discord || officer.id;

            document.getElementById('modal-title').innerText = 'تعديل بيانات الضابط';
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        };

        window.deleteOfficer = function(id) {
            if (confirm('هل أنت تأكد من إزالة هذا الضابط من السجل؟')) {
                officers = officers.filter(o => String(o.id) !== String(id));
                saveToLocalStorage();
                renderRoster();
            }
        };

        document.getElementById('export-csv').addEventListener('click', () => {
            let csv = 'Badge,Name,Rank,Category,Responsibility,Status,Strikes,DiscordID\n';
            officers.forEach(o => {
                const parsed = processOfficerBadgeAndName(o.name, o.badge);
                csv += `"${parsed.badge}","${parsed.name}","${o.rank || ''}","${o.category || ''}","${o.responsibility || 'N/A'}","${o.status || 'Active'}",${o.strikes || 0},"${o.discord || o.id}"\n`;
            });
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.setAttribute('href', url);
            a.setAttribute('download', 'PLPD_Personnel_Roster.csv');
            a.click();
        });

        fetchLiveRoster();
        setInterval(fetchLiveRoster, 15000);
    </script>
</body>
</html>
